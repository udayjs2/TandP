<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>T&amp;P Textiles — Workshop Management</title>
    <link rel="icon" href="/logo-mark-navy.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1F2A44" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="T&amp;P Textiles" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* sub-module buttons: same navy as the header, white text */
      .subtab-bar { display: flex; flex-wrap: wrap; gap: .5rem; padding: .1rem 0 .25rem; }
      .subtab { display: inline-flex; align-items: center; gap: .4rem; padding: .55rem 1.1rem; border-radius: .6rem; font-size: .8rem; font-weight: 500;
        white-space: nowrap; background: #1e1b4b; color: #fff; border: 2px solid transparent; transition: background .15s; }
      .subtab:hover { background: #2b2780; }
      .subtab-active { font-weight: 700; border-bottom-color: #fbbf24; box-shadow: 0 2px 6px rgba(30,27,75,.35); }
      /* every data table: navy header row, white letters */
      table thead, table thead tr { background: #1e1b4b !important; }
      table thead th { background: #1e1b4b !important; color: #fff !important; font-weight: 600; }
      @media print { table thead, table thead tr, table thead th { background: transparent !important; color: inherit !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
