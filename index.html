<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>T&amp;P Textiles — Workshop Management</title>
    <link rel="icon" href="/logo-mark-navy.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1F2A44" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="T&amp;P Textiles" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* sub-module toolbar: same look as the header toolbar */
      .subtab-bar { display: flex; gap: .25rem; overflow-x: auto; background: #2f3f87; border-radius: .6rem; padding: 0 .6rem; scrollbar-width: thin; scrollbar-color: #8da2fb #2f3f87; }
      .subtab { display: inline-flex; align-items: center; gap: .4rem; padding: .7rem .85rem; font-size: .75rem; font-weight: 500; white-space: nowrap;
        background: transparent; color: #c7d2fe; border-bottom: 2px solid transparent; transition: color .15s; }
      .subtab:hover { color: #fff; }
      .subtab-active { color: #fff; border-bottom-color: #fbbf24; }
      /* third level: plain text tabs, no bar */
      .has-shell-bar .subtab-bar { background: transparent; border-radius: 0; padding: 0; gap: 1.25rem; border-bottom: 1px solid #e7e5e4; }
      .has-shell-bar .subtab { color: #78716c; padding: .45rem 0; font-size: .8rem; }
      .has-shell-bar .subtab:hover { color: #1c1917; }
      .has-shell-bar .subtab-active { color: #2f3f87; font-weight: 600; border-bottom-color: #2f3f87; }
      header nav { scrollbar-width: thin; scrollbar-color: #8da2fb #232d63; }
      /* every data table: navy header row, white letters */
      table thead, table thead tr { background: #2f3f87 !important; }
      table thead th { background: #2f3f87 !important; color: #fff !important; font-weight: 600; }
      @media print { table thead, table thead tr, table thead th { background: transparent !important; color: inherit !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
